name: Trigger Jenkins Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_JOB_TOKEN: ${{ secrets.JENKINS_JOB_TOKEN }}
        run: |
          curl --fail -X POST \
            "${JENKINS_URL}/buildByToken/build?job=STEMCraft&token=${JENKINS_JOB_TOKEN}"