name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Force release"
        required: false
        default: "false"

permissions: read-all

jobs:
  prepare:
    name: Prepare Build Metadata
    if: >
      gitea.event.workflow_run.conclusion == 'success' &&
      gitea.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      build_number: ${{ steps.meta.outputs.build_number }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ gitea.event.workflow_run.head_sha }}

      - name: Calculate build metadata
        id: meta
        env:
          SHA: ${{ gitea.event.workflow_run.head_sha }}
        run: |
          set -eu

          LAST_TAG="$(git tag --list 'build-*' | sed 's/build-//' | sort -n | tail -1)"
          if [ -z "$LAST_TAG" ]; then
            BUILD_NUMBER=1
          else
            BUILD_NUMBER=$((LAST_TAG + 1))
          fi

          TAG="build-$BUILD_NUMBER"
          RELEASE_NAME="Build $BUILD_NUMBER"

          {
            echo "build_number=$BUILD_NUMBER"
            echo "tag=$TAG"
            echo "release_name=$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

  api-publish:
    name: Publish API Snapshot
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ gitea.event.workflow_run.head_sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Maven repository path
        env:
          MAVEN_REPO_DIR: ${{ vars.MAVEN_REPO_DIR || '/repos/maven/maven-public' }}
        run: |
          set -eu
          [ -d "$MAVEN_REPO_DIR" ] || { echo "Missing repo dir"; exit 1; }
          [ -w "$MAVEN_REPO_DIR" ] || { echo "Repo dir not writable"; exit 1; }

      - name: Publish API snapshot
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          MAVEN_REPO_DIR: ${{ vars.MAVEN_REPO_DIR || '/repos/maven/maven-public' }}
        run: ./gradlew --no-daemon :api:publishMavenJavaPublicationToMavenRepository

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - api-publish
    permissions:
      contents: write
      releases: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ gitea.event.workflow_run.head_sha }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release JARs
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: ./gradlew --no-daemon :api:jar :plugin:jar

      - name: Collect release files
        run: |
          mkdir -p dist
          cp api/build/libs/STEMCraft-API-*.jar dist/
          cp plugin/build/libs/STEMCraft-*.jar dist/

      - name: Create or update release and upload JARs
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          REPOSITORY: ${{ gitea.repository }}
          SHA: ${{ gitea.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu

          OWNER="${REPOSITORY%/*}"
          REPO="${REPOSITORY#*/}"
          TAGS_ENDPOINT="$GITEA_API_URL/repos/$OWNER/$REPO/tags"
          RELEASES_ENDPOINT="$GITEA_API_URL/repos/$OWNER/$REPO/releases"
          AUTH_HEADER="Authorization: token $GITEA_TOKEN"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          short_sha = os.environ["SHA"][:10]
          body_lines = [
              f"Automated build `{os.environ['BUILD_NUMBER']}` for commit `{short_sha}`.",
              "",
              "Assets:",
              "- STEMCraft plugin JAR",
              "- STEMCraft API JAR",
          ]

          Path("tag.json").write_text(json.dumps({
              "tag_name": os.environ["TAG"],
              "target": os.environ["SHA"],
              "message": os.environ["RELEASE_NAME"],
          }), encoding="utf-8")

          Path("release.json").write_text(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["SHA"],
              "name": os.environ["RELEASE_NAME"],
              "body": "\n".join(body_lines),
              "draft": False,
              "prerelease": False,
          }), encoding="utf-8")
          PY

          TAG_RESPONSE="$(mktemp)"
          TAG_STATUS="$(curl --silent --show-error --location \
            --output "$TAG_RESPONSE" \
            --write-out "%{http_code}" \
            --request POST \
            --header "$AUTH_HEADER" \
            --header "Content-Type: application/json" \
            --data @tag.json \
            "$TAGS_ENDPOINT")"

          TAG_ALREADY_EXISTS=false
          case "$TAG_STATUS" in
            200|201)
              ;;
            409)
              TAG_ALREADY_EXISTS=true
              ;;
            *)
              echo "Failed to create tag:"
              cat "$TAG_RESPONSE"
              exit 1
              ;;
          esac

          RELEASE_RESPONSE="$(mktemp)"
          RELEASE_STATUS="$(curl --silent --show-error --location \
            --output "$RELEASE_RESPONSE" \
            --write-out "%{http_code}" \
            --header "$AUTH_HEADER" \
            "$RELEASES_ENDPOINT/tags/$TAG")"

          if [ "$RELEASE_STATUS" = "404" ]; then
            if [ "$TAG_ALREADY_EXISTS" = "true" ]; then
              echo "Tag $TAG already exists without a matching release. Refusing to attach assets blindly."
              exit 1
            fi

            RELEASE_STATUS="$(curl --silent --show-error --location \
              --output "$RELEASE_RESPONSE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "$AUTH_HEADER" \
              --header "Content-Type: application/json" \
              --data @release.json \
              "$RELEASES_ENDPOINT")"

            if [ "$RELEASE_STATUS" != "201" ]; then
              echo "Failed to create release:"
              cat "$RELEASE_RESPONSE"
              exit 1
            fi
          elif [ "$RELEASE_STATUS" = "200" ]; then
            if [ "$TAG_ALREADY_EXISTS" = "true" ]; then
              EXISTING_TARGET="$(python3 - "$RELEASE_RESPONSE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh).get("target_commitish", ""))
          PY
              )"

              if [ "$EXISTING_TARGET" != "$SHA" ]; then
                echo "Tag $TAG already points at $EXISTING_TARGET, not $SHA. Refusing to overwrite another release."
                exit 1
              fi
            fi

            RELEASE_ID="$(python3 - "$RELEASE_RESPONSE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh)["id"])
          PY
            )"

            RELEASE_STATUS="$(curl --silent --show-error --location \
              --output "$RELEASE_RESPONSE" \
              --write-out "%{http_code}" \
              --request PATCH \
              --header "$AUTH_HEADER" \
              --header "Content-Type: application/json" \
              --data @release.json \
              "$RELEASES_ENDPOINT/$RELEASE_ID")"

            if [ "$RELEASE_STATUS" != "200" ]; then
              echo "Failed to update release:"
              cat "$RELEASE_RESPONSE"
              exit 1
            fi
          else
            echo "Failed to fetch release:"
            cat "$RELEASE_RESPONSE"
            exit 1
          fi

          RELEASE_ID="$(python3 - "$RELEASE_RESPONSE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh)["id"])
          PY
          )"

          set -- dist/*.jar
          if [ ! -e "$1" ]; then
            echo "No JAR files were downloaded for release upload."
            exit 1
          fi

          for asset in "$@"; do
            ASSET_NAME="$(basename "$asset")"
            EXISTING_ASSET_ID="$(python3 - "$RELEASE_RESPONSE" "$ASSET_NAME" <<'PY'
          import json
          import sys

          release_path = sys.argv[1]
          asset_name = sys.argv[2]

          with open(release_path, "r", encoding="utf-8") as fh:
              for asset in json.load(fh).get("assets", []):
                  if asset.get("name") == asset_name:
                      print(asset["id"])
                      break
          PY
            )"

            if [ -n "$EXISTING_ASSET_ID" ]; then
              DELETE_STATUS="$(curl --silent --show-error --location \
                --output /dev/null \
                --write-out "%{http_code}" \
                --request DELETE \
                --header "$AUTH_HEADER" \
                "$RELEASES_ENDPOINT/$RELEASE_ID/assets/$EXISTING_ASSET_ID")"

              case "$DELETE_STATUS" in
                204|404)
                  ;;
                *)
                  echo "Failed to delete existing asset $ASSET_NAME"
                  exit 1
                  ;;
              esac
            fi

            UPLOAD_RESPONSE="$(mktemp)"
            UPLOAD_STATUS="$(curl --silent --show-error --location \
              --output "$UPLOAD_RESPONSE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "$AUTH_HEADER" \
              --form "attachment=@$asset" \
              "$RELEASES_ENDPOINT/$RELEASE_ID/assets")"

            if [ "$UPLOAD_STATUS" != "201" ]; then
              echo "Failed to upload asset $ASSET_NAME:"
              cat "$UPLOAD_RESPONSE"
              exit 1
            fi
          done
