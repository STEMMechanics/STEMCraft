name: Build Plugin

on:
  push:
    branches: [ '**' ]
    paths:
      - 'api/**'
      - 'plugin/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'buildSource.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
  pull_request:
    paths:
      - 'api/**'
      - 'plugin/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'buildSource.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
  workflow_dispatch:
    inputs:
      release:
        description: "Create release"
        required: false
        default: "false"
      build_name:
        description: "Optional build label"
        required: false
        default: ""

permissions: read-all

jobs:
  prepare:
    name: Prepare Build Metadata
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      build_number: ${{ steps.meta.outputs.build_number }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate build metadata
        id: meta
        env:
          EVENT_NAME: ${{ gitea.event_name }}
          REF_NAME: ${{ gitea.ref_name }}
          DEFAULT_BRANCH: ${{ gitea.event.repository.default_branch }}
          RUN_NUMBER: ${{ gitea.run_number }}
          INPUT_RELEASE: ${{ inputs.release || 'false' }}
          INPUT_BUILD_NAME: ${{ inputs.build_name || '' }}
        run: |
          set -eu

          SHOULD_RELEASE=false

          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ] && {
            [ "$EVENT_NAME" = "push" ] || [ "$INPUT_RELEASE" = "true" ];
          }; then
            SHOULD_RELEASE=true
          fi

          if [ "$SHOULD_RELEASE" = "true" ]; then
            LAST_TAG="$(git tag --list 'build-*' | sed 's/build-//' | sort -n | tail -1)"
            if [ -z "$LAST_TAG" ]; then
              BUILD_NUMBER=1
            else
              BUILD_NUMBER=$((LAST_TAG + 1))
            fi
            TAG="build-$BUILD_NUMBER"
          else
            BUILD_NUMBER="$RUN_NUMBER"
            TAG=""
          fi

          if [ -n "$INPUT_BUILD_NAME" ]; then
            RELEASE_NAME="$INPUT_BUILD_NAME"
          elif [ "$SHOULD_RELEASE" = "true" ]; then
            RELEASE_NAME="Build $BUILD_NUMBER"
          else
            RELEASE_NAME="Build $BUILD_NUMBER (CI)"
          fi

          {
            echo "should_release=$SHOULD_RELEASE"
            echo "build_number=$BUILD_NUMBER"
            echo "tag=$TAG"
            echo "release_name=$RELEASE_NAME"
          } >> "$GITHUB_OUTPUT"

  build-and-test:
    name: Test and Build Plugin and API JARs
    if: ${{ gitea.event_name != 'push' || gitea.ref_name == 'dev' || gitea.ref_name == gitea.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - prepare
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run analysis, tests, and build jars
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: ./gradlew --no-daemon check :api:jar :plugin:jar

      - name: Summarize SpotBugs report
        if: always()
        run: |
          set +e

          REPORT="plugin/build/reports/spotbugs/main.xml"
          if [ ! -f "$REPORT" ]; then
            echo "No SpotBugs XML report was generated." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("plugin/build/reports/spotbugs/main.xml")
          root = ET.parse(report).getroot()
          bugs = root.findall("BugInstance")

          print("## SpotBugs Report")
          print()
          print(f"Found {len(bugs)} bug instance(s) in `plugin/build/reports/spotbugs/main.xml`.")

          if not bugs:
            raise SystemExit(0)

          print()
          print("```text")
          for bug in bugs[:20]:
            bug_type = bug.get("type", "UNKNOWN")
            long_message = bug.findtext("LongMessage", default=bug_type).strip()
            source = bug.find("SourceLine")
            location = "unknown location"
            if source is not None:
              source_file = source.get("sourcefile") or source.get("classname") or "unknown"
              start = source.get("start")
              location = f"{source_file}:{start}" if start else source_file
            print(f"- [{bug_type}] {location} - {long_message}")
          if len(bugs) > 20:
            print(f"... and {len(bugs) - 20} more")
          print("```")
          PY

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: release-build-reports-${{ gitea.run_number }}
          if-no-files-found: ignore
          path: |
            build/reports/problems/problems-report.html
            api/build/reports/**
            plugin/build/reports/**
            plugin/build/test-results/**

  api-publish:
    name: Publish API Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - prepare
      - build-and-test
    if: needs.prepare.outputs.should_release == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Maven repository path
        env:
          MAVEN_REPO_DIR: ${{ vars.MAVEN_REPO_DIR || '/repos/maven/maven-public' }}
        run: |
          set -eu

          if [ ! -d "$MAVEN_REPO_DIR" ]; then
            echo "MAVEN_REPO_DIR does not exist: $MAVEN_REPO_DIR"
            exit 1
          fi

          if [ ! -w "$MAVEN_REPO_DIR" ]; then
            echo "MAVEN_REPO_DIR is not writable: $MAVEN_REPO_DIR"
            exit 1
          fi

      - name: Publish API snapshot
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          MAVEN_REPO_DIR: ${{ vars.MAVEN_REPO_DIR || '/repos/maven/maven-public' }}
        run: ./gradlew --no-daemon :api:publishMavenJavaPublicationToMavenRepository

  release:
    name: Create Release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - prepare
      - build-and-test
      - api-publish
    if: needs.prepare.outputs.should_release == 'true'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build release JARs
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
        run: ./gradlew --no-daemon :api:jar :plugin:jar

      - name: Collect release files
        run: |
          mkdir -p dist
          cp api/build/libs/STEMCraft-API-*.jar dist/
          cp plugin/build/libs/STEMCraft-*.jar dist/

      - name: Create or update release and upload JARs
        env:
          BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
          GITEA_API_URL: ${{ gitea.api_url }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_NAME: ${{ needs.prepare.outputs.release_name }}
          REPOSITORY: ${{ gitea.repository }}
          SHA: ${{ gitea.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -eu

          OWNER="${REPOSITORY%/*}"
          REPO="${REPOSITORY#*/}"
          TAGS_ENDPOINT="$GITEA_API_URL/repos/$OWNER/$REPO/tags"
          RELEASES_ENDPOINT="$GITEA_API_URL/repos/$OWNER/$REPO/releases"
          AUTH_HEADER="Authorization: token $GITEA_TOKEN"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          short_sha = os.environ["SHA"][:10]
          body_lines = [
              f"Automated build `{os.environ['BUILD_NUMBER']}` for commit `{short_sha}`.",
              "",
              "Assets:",
              "- STEMCraft plugin JAR",
              "- STEMCraft API JAR",
          ]

          Path("tag.json").write_text(json.dumps({
              "tag_name": os.environ["TAG"],
              "target": os.environ["SHA"],
              "message": os.environ["RELEASE_NAME"],
          }), encoding="utf-8")

          Path("release.json").write_text(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["SHA"],
              "name": os.environ["RELEASE_NAME"],
              "body": "\n".join(body_lines),
              "draft": False,
              "prerelease": False,
          }), encoding="utf-8")
          PY

          TAG_RESPONSE="$(mktemp)"
          TAG_STATUS="$(curl --silent --show-error --location \
            --output "$TAG_RESPONSE" \
            --write-out "%{http_code}" \
            --request POST \
            --header "$AUTH_HEADER" \
            --header "Content-Type: application/json" \
            --data @tag.json \
            "$TAGS_ENDPOINT")"

          TAG_ALREADY_EXISTS=false
          case "$TAG_STATUS" in
            200|201)
              ;;
            409)
              TAG_ALREADY_EXISTS=true
              ;;
            *)
              echo "Failed to create tag:"
              cat "$TAG_RESPONSE"
              exit 1
              ;;
          esac

          RELEASE_RESPONSE="$(mktemp)"
          RELEASE_STATUS="$(curl --silent --show-error --location \
            --output "$RELEASE_RESPONSE" \
            --write-out "%{http_code}" \
            --header "$AUTH_HEADER" \
            "$RELEASES_ENDPOINT/tags/$TAG")"

          if [ "$RELEASE_STATUS" = "404" ]; then
            if [ "$TAG_ALREADY_EXISTS" = "true" ]; then
              echo "Tag $TAG already exists without a matching release. Refusing to attach assets blindly."
              exit 1
            fi

            RELEASE_STATUS="$(curl --silent --show-error --location \
              --output "$RELEASE_RESPONSE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "$AUTH_HEADER" \
              --header "Content-Type: application/json" \
              --data @release.json \
              "$RELEASES_ENDPOINT")"

            if [ "$RELEASE_STATUS" != "201" ]; then
              echo "Failed to create release:"
              cat "$RELEASE_RESPONSE"
              exit 1
            fi
          elif [ "$RELEASE_STATUS" = "200" ]; then
            if [ "$TAG_ALREADY_EXISTS" = "true" ]; then
              EXISTING_TARGET="$(python3 - "$RELEASE_RESPONSE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh).get("target_commitish", ""))
          PY
              )"

              if [ "$EXISTING_TARGET" != "$SHA" ]; then
                echo "Tag $TAG already points at $EXISTING_TARGET, not $SHA. Refusing to overwrite another release."
                exit 1
              fi
            fi

            RELEASE_ID="$(python3 - "$RELEASE_RESPONSE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh)["id"])
          PY
            )"

            RELEASE_STATUS="$(curl --silent --show-error --location \
              --output "$RELEASE_RESPONSE" \
              --write-out "%{http_code}" \
              --request PATCH \
              --header "$AUTH_HEADER" \
              --header "Content-Type: application/json" \
              --data @release.json \
              "$RELEASES_ENDPOINT/$RELEASE_ID")"

            if [ "$RELEASE_STATUS" != "200" ]; then
              echo "Failed to update release:"
              cat "$RELEASE_RESPONSE"
              exit 1
            fi
          else
            echo "Failed to fetch release:"
            cat "$RELEASE_RESPONSE"
            exit 1
          fi

          RELEASE_ID="$(python3 - "$RELEASE_RESPONSE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], "r", encoding="utf-8") as fh:
              print(json.load(fh)["id"])
          PY
          )"

          set -- dist/*.jar
          if [ ! -e "$1" ]; then
            echo "No JAR files were downloaded for release upload."
            exit 1
          fi

          for asset in "$@"; do
            ASSET_NAME="$(basename "$asset")"
            EXISTING_ASSET_ID="$(python3 - "$RELEASE_RESPONSE" "$ASSET_NAME" <<'PY'
          import json
          import sys

          release_path = sys.argv[1]
          asset_name = sys.argv[2]

          with open(release_path, "r", encoding="utf-8") as fh:
              for asset in json.load(fh).get("assets", []):
                  if asset.get("name") == asset_name:
                      print(asset["id"])
                      break
          PY
            )"

            if [ -n "$EXISTING_ASSET_ID" ]; then
              DELETE_STATUS="$(curl --silent --show-error --location \
                --output /dev/null \
                --write-out "%{http_code}" \
                --request DELETE \
                --header "$AUTH_HEADER" \
                "$RELEASES_ENDPOINT/$RELEASE_ID/assets/$EXISTING_ASSET_ID")"

              case "$DELETE_STATUS" in
                204|404)
                  ;;
                *)
                  echo "Failed to delete existing asset $ASSET_NAME"
                  exit 1
                  ;;
              esac
            fi

            UPLOAD_RESPONSE="$(mktemp)"
            UPLOAD_STATUS="$(curl --silent --show-error --location \
              --output "$UPLOAD_RESPONSE" \
              --write-out "%{http_code}" \
              --request POST \
              --header "$AUTH_HEADER" \
              --form "attachment=@$asset" \
              "$RELEASES_ENDPOINT/$RELEASE_ID/assets")"

            if [ "$UPLOAD_STATUS" != "201" ]; then
              echo "Failed to upload asset $ASSET_NAME:"
              cat "$UPLOAD_RESPONSE"
              exit 1
            fi
          done
