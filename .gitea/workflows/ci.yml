name: CI

on:
  pull_request:
  push:
    branches: [ main, dev ]

permissions: read-all

jobs:
  build-and-test:
    name: Test and Build Plugin and API JARs
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run tests and build jars
        run: ./gradlew --no-daemon :plugin:test :api:jar :plugin:jar