plugins {
    id 'java-library'
    id 'maven-publish'
}

apply from: "$rootDir/buildSource.gradle"

def apiMavenRepoDir = (findProperty("stemcraftApiRepoDir")
    ?: System.getenv("MAVEN_REPO_DIR")
    ?: "/repos/maven/maven-public").toString()

repositories {
    mavenCentral()
    maven { url = uri("https://repo.papermc.io/repository/maven-public/") }
    maven { url = uri("https://repo.opencollab.dev/main/") }
    maven { url = uri("https://maven.enginehub.org/repo/") }
    maven {
        name = "papermc"
        url = uri("https://repo.papermc.io/repository/maven-public/")
    }
}

dependencies {
    //noinspection VulnerableLibrariesLocal
    compileOnly("io.papermc.paper:paper-api:26.1.2.build.+")

    // WorldEdit
    compileOnly("com.sk89q.worldedit:worldedit-bukkit:7.4.2")

    // GeyserMC API
    compileOnly('org.geysermc.geyser:api:2.9.0-SNAPSHOT')

    // LuckPerms
    compileOnly 'net.luckperms:api:5.4'

    // Jackson for JSON handling
    compileOnly("com.fasterxml.jackson.core:jackson-databind:2.21.1")
    implementation("com.fasterxml.jackson.core:jackson-core:2.21.1")
    implementation("com.fasterxml.jackson.core:jackson-annotations:2.21")

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0"
    testImplementation "org.mockito:mockito-core:5.12.0"
    //noinspection VulnerableLibrariesLocal
    testImplementation "io.papermc.paper:paper-api:26.1.2.build.+"
    //noinspection VulnerableLibrariesLocal
    testImplementation("org.mockbukkit.mockbukkit:mockbukkit-v1.21:4.108.0") {
        exclude group: "org.junit"
        exclude group: "org.junit.jupiter"
        exclude group: "org.junit.platform"
    }
    testImplementation("com.fasterxml.jackson.core:jackson-databind:2.21.1")
    testImplementation("com.google.code.gson:gson:2.11.0")
    testImplementation("org.geysermc.geyser:api:2.9.0-SNAPSHOT")
    testImplementation("net.luckperms:api:5.4")
    testImplementation("com.sk89q.worldedit:worldedit-bukkit:7.4.3-SNAPSHOT")
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.0"
}

test {
    useJUnitPlatform()
}
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
            artifactId = "stemcraft-api"
            version = project.version.toString()
        }
    }
    repositories {
        maven { url = uri(new File(apiMavenRepoDir)) }
    }
}

tasks.named("jar", Jar) {
    archiveBaseName.set("STEMCraft-API")

    archiveVersion.set("${project.version}${getArchiveBuildMetadata()}")
}
