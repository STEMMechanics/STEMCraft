name: Bug report
description: Report a problem with STEMCraft and include the information needed to reproduce and diagnose it.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible defects in STEMCraft itself. Include exact commands, config snippets, stack traces, or screenshots where they help.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the bug.
      placeholder: When a player joins challenge_treehouse, the configured join command is not run.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps needed to trigger the issue.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Join world ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead?
      placeholder: The player should receive the configured book and no errors should be logged.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: The player joined normally, no command ran, and Paper logged an exception.
    validations:
      required: true

  - type: input
    id: stemcraft-version
    attributes:
      label: STEMCraft version
      description: Plugin version, build number, or commit if testing a branch build.
      placeholder: build-31 / 26.2.x / commit abc1234
    validations:
      required: true

  - type: input
    id: server-version
    attributes:
      label: Server software and version
      description: Include Paper and Minecraft version.
      placeholder: Paper 26.2 build 60 on Minecraft 1.21.x
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      description: Paste the smallest config snippet needed to understand the issue.
      render: yaml
      placeholder: |
        worlds:
          challenge_treehouse:
            join-commands:
              - book show challenge-treehouse
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack traces
      description: Paste errors, warnings, or command output.
      render: text
      placeholder: Paste stack traces or console output here.
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add anything else that helps explain the issue.
      placeholder: Screenshots, related plugins, or notes about whether this is a regression.
    validations:
      required: false
