import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort
import com.github.spotbugs.snom.SpotBugsTask

plugins {
    id 'base'   // root is just a container, no jar
    id 'com.github.spotbugs' version '6.2.5' apply false
}

ext {
    // Paper 26.3 is currently published on the BETA channel. Keep this pinned
    // so a later Paper build cannot silently change the compatibility surface.
    paperApiVersion = "26.3.build.142-beta"
    paperRuntimeVersion = "26.3"
    // MockBukkit has not released a 26.3 implementation yet. Keep its test
    // runtime on the last compatible Paper API until that artifact exists.
    paperTestRuntimeVersion = "26.2.build.123-stable"
    javaToolchainVersion = 25
}

subprojects {
    group = 'dev.stemcraft'
    version = "1.0.0-SNAPSHOT"

    repositories {
        mavenCentral()
        maven {
            name = "papermc-repo"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ["-Xlint:all", "-Xlint:-processing"]
    }

    plugins.withId("java") {
        apply plugin: "com.github.spotbugs"

        java {
            toolchain.languageVersion = JavaLanguageVersion.of(rootProject.ext.javaToolchainVersion)
        }

        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
        }

        spotbugs {
            effort = Effort.valueOf('MAX')
            reportLevel = Confidence.valueOf('HIGH')
            ignoreFailures = false
        }

        tasks.configureEach { task ->
            if (task instanceof SpotBugsTask) {
                SpotBugsTask spotBugsTask = task
                spotBugsTask.reports.maybeCreate("html").required.set(true)
                spotBugsTask.reports.maybeCreate("xml").required.set(true)
            }
        }

        tasks.named("spotbugsTest") {
            enabled = false
        }

        tasks.named("check") {
            dependsOn(tasks.named("spotbugsMain"))
        }
    }
}
