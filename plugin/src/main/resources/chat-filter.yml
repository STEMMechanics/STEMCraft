# chat-filter.yml

# If a message matches ANY blacklist regex
# AND does NOT match any whitelist regex
# it will be blocked.

blacklist:
  # --- "Swearing (common + obfuscated) ---"
  - "f+\\W*u+\\W*c+\\W*k+|f+u+c+k+"
  - "s+\\W*h+\\W*i+\\W*t+|s+h+i+t+"
  - "b+\\W*i+\\W*t+\\W*c+\\W*h+|b+i+t+c+h+"
  - "a+\\W*s+\\W*s+|a+s+s+"
  - "d+\\W*a+\\W*m+\\W*n+|d+a+m+n+"
  - "c+\\W*r+\\W*a+\\W*p+|c+r+a+p+"

  # --- "Sexual / adult terms ---"
  - "p+\\W*o+\\W*r+\\W*n+|p+o+r+n+"
  - "s+\\W*e+\\W*x+|s+e+x+"

  # --- "Harassment / slurs (light set, kid-safe) ---"
  - "k+y+s+|kill\\s*yourself"
  - "i+d+i+o+t+|i+d+o+t+"
  - "stupid|dumb"

  # --- "URL / link sharing (generic) ---"
  - "https?://"
  - "www\\."
  - "[a-z0-9-]+\\.(com|net|org|gg|io|xyz|ru|cn|tk)"

warninglist:
  # --- "Mild insults / teasing ---"
  - "noob|nub|newb"
  - "stupid|dumb|idiot"
  - "loser|trash|garbage"
  - "bad|terrible|useless"

  # --- "Aggressive tone / escalation ---"
  - "shut\\s*up"
  - "go\\s*away"
  - "i\\s*hate\\s*you"
  - "you\\s*suck"

  # --- "Almost-swears / softened swears ---"
  - "heck|dang|frick|freakin|crap"

  # --- "Targeted negativity ---"
  - "you\\s+(are|r)\\s+(bad|dumb|annoying)"

  # --- "Early harassment patterns ---"
  - "stop\\s*being"
  - "why\\s*are\\s*you\\s*so"

whitelist:
  # --- "Allowed educational / game sites ---"
  - "minecraft\\.net"
  - "minecraft\\.com"
  - "microsoft\\.com"
  - "minecraftskins\\.com"
  - "stemmechanics\\.com\\.au"
  - "stemcraft\\.com\\.au"

  # --- "Allow common Minecraft terms that look risky ---"
  - "ass" # allow "ass" in words like "grass"