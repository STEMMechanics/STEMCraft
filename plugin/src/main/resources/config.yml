entitlements:
  notifications:
    enabled: true
    ability-gained: "/survival//success/New ability: <yellow>{name}</yellow> — {description}"
    ability-lost: "/survival//warn/Ability lost: <yellow>{name}</yellow> — {description}"
    badge-gained: "/success/Badge earned: {badge} <yellow>{description}</yellow>"
    badge-lost: "/warn/Badge lost: {badge} <yellow>{description}</yellow>"
  badge-display:
    prefix: " "
    separator: ""
    suffix: ""
  badges:
    explorer:
      display: ":compass:"
      description: "Completed 10 different quests"
      permission: stemcraft.badge.explorer
      priority: 20
    quest-master:
      display: ":question_yellow:"
      description: "Completed 50 different quests"
      permission: stemcraft.badge.quest-master
      priority: 60
    veteran:
      display: ":clock:"
      description: "Played on STEMCraft for 100 hours"
      permission: stemcraft.badge.veteran
      priority: 50
    survival-veteran:
      display: ":survival:"
      description: "Played Survival for 100 hours"
      permission: stemcraft.badge.survival-veteran
      priority: 55
    bedwars-player:
      display: ":swords:"
      description: "Completed 50 BedWars games"
      permission: stemcraft.badge.bedwars-player
      priority: 30
    bedwars-champion:
      display: ":crown:"
      description: "Won 25 BedWars games"
      permission: stemcraft.badge.bedwars-champion
      priority: 70
    bridge-hot-streak:
      display: ":star:"
      description: "Won 10 Bridge games in 28 days"
      permission: stemcraft.badge.bridge-hot-streak
      priority: 80
    builder:
      display: ":crafting_table:"
      description: "Placed 10,000 Survival blocks"
      permission: stemcraft.badge.builder
      priority: 35
    event-winner:
      display: ":trophy:"
      description: "Winner of a STEMCraft community event"
      permission: stemcraft.badge.event-winner
      priority: 100
  definitions:
    # Conditions may use nested `all` (AND), `any` (OR), and `not` groups.
    # Leaf conditions support `stat`, `permission`, `quest-completed`, and `quests-completed`.
    # Existing singular `stat`, `stats`, `permissions`, and quest conditions remain supported.
    # Example skill-tree branch:
    # when:
    #   all:
    #     - stat: {key: skill_mining_xp, at-least: 400}
    #     - stat: {key: skill_farming_xp, at-least: 800}
    #     - permission: stemcraft.skilltree.foundation
    #     - not:
    #         permission: stemcraft.skilltree.conflicting-branch
    explorer:
      when:
        quests-completed:
          at-least: 10
      grants:
        badges: [explorer]
    quest-master:
      when:
        quests-completed:
          at-least: 50
      grants:
        badges: [quest-master]
    veteran:
      when:
        stat:
          key: play_time
          at-least: 100
      grants:
        badges: [veteran]
    survival-veteran:
      when:
        stat:
          key: time_in_survival
          at-least: 100
      grants:
        badges: [survival-veteran]
    bedwars-player:
      when:
        stat:
          key: minigame_bedwars_games_played
          at-least: 50
      grants:
        badges: [bedwars-player]
    bedwars-champion:
      when:
        stat:
          key: minigame_bedwars_wins
          at-least: 25
      grants:
        badges: [bedwars-champion]
    bridge-hot-streak:
      when:
        stat:
          key: minigame_bridge_wins
          at-least: 10
          duration: 28d
      grants:
        badges: [bridge-hot-streak]
    builder:
      when:
        stat:
          key: blocks_placed_group_survival
          at-least: 10000
      grants:
        badges: [builder]
    qol-tool-refill:
      name: "Backup tools"
      description: "A matching tool or weapon is automatically equipped when yours breaks."
      when:
        any:
          - stat: {key: skill_mining_xp, at-least: 400}
          - stat: {key: skill_herbalism_xp, at-least: 400}
          - stat: {key: skill_farming_xp, at-least: 400}
          - stat: {key: skill_melee_combat_xp, at-least: 400}
          - stat: {key: skill_ranged_combat_xp, at-least: 400}
      grants:
        permissions: [stemcraft.qol.auto-refill-tools]
    qol-farming-hoe-harvest:
      name: "Quick crop harvest"
      description: "Sneak and right-click a ripe crop with a hoe to harvest and replant a 3×3 area."
      when:
        stat:
          key: skill_farming_xp
          at-least: 400
      grants:
        permissions: [stemcraft.qol.hoe-harvest]
    qol-engineering-auto-refill:
      name: "Automatic item refill"
      description: "Used blocks and items are automatically replaced from your inventory."
      when:
        stat:
          key: skill_engineering_xp
          at-least: 400
      grants:
        permissions: [stemcraft.qol.auto-refill]
    qol-auto-select-tool:
      name: "Automatic tool selection"
      description: "Right-click a block to equip the best tool for it from your inventory."
      when:
        all:
          - stat: {key: skill_mining_xp, at-least: 900}
          - stat: {key: skill_engineering_xp, at-least: 900}
      grants:
        permissions: [stemcraft.qol.auto-select-tool]
    qol-farming-stronger-leads:
      name: "Stronger leads"
      description: "Leads no longer snap when an animal falls too far behind."
      when:
        stat:
          key: skill_farming_xp
          at-least: 900
      grants:
        permissions: [stemcraft.qol.stronger-leads]
    qol-engineering-powered-minecarts:
      name: "Faster minecarts"
      description: "Powered minecarts travel faster."
      when:
        stat:
          key: skill_engineering_xp
          at-least: 1600
      grants:
        permissions: [stemcraft.qol.powered-minecarts]
    qol-farming-named-mob-info:
      name: "Animal information"
      description: "Right-click a named animal to see its health and owner."
      when:
        stat:
          key: skill_farming_xp
          at-least: 1600
      grants:
        permissions: [stemcraft.qol.named-mob-info]
    event-winner:
      grants:
        badges: [event-winner]

