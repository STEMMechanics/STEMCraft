  center-text: false

hub:
  world: world
  exit_commands:
    bw_*:
      command: "bw leave"
      as-player: true
    PartyGames:
      command: "pg leave"
      as-player: true
    tb_*:
      command: "tb leave"
      as-player: true

worlds:
  world:
    display-name: "World"

custom-commands:
  survival:
    permission: stemcraft.command.survival
    command: survival
    run:
      - tpworld survival

custom-portals:
  enabled: true
  # Teleport as soon as a player enters a registered portal block. Set false to use the vanilla portal warm-up.
  instant-teleport: true
  portals: {}

mailboxes:
  enabled: true
  hologram:
    text: ":mail_large:"
  delivery:
    # Initial delivery delay before mail is delivered to the recipient inbox.
    base-delay: 72000
    # How often the delivery queue runs, in ticks.
    process-mail-queue: 20
    # Minimum time between "mailbox full" notices to the same player, in ticks.
    mailbox-full-cooldown: 72000
  dialog:
    title: "STEMCraft Mail"
    notice: "<yellow>This message and all items in the mailbox will be sent to the player below.</yellow>"
    recipient-label: "Send to"
    message-label: "Message"
    send-label: "Send"
    cancel-label: "Cancel"
    open-failed: "/error/Could not open the mail dialog. Your items remain in the mailbox."
    cancelled: "/info/Send mail cancelled. Your items remain in the mailbox."
  messages:
    place-failed: "/error/Failed to place mailbox: {error}"
    recipient-required: "/error/Enter the name of the player you want to send this mail to."
    recipient-not-found: "/error/Could not find a player named '{recipient}'."
    self-recipient: "/error/You cannot send mail to yourself."
    too-many-items: "/error/You cannot send that many items to a player at once."
    queued: "/success/Mail sent to {recipient}"
    mailbox-full: "/survival//warn/Your mailbox is full."
    received: "/survival//info/<gold>You received mail from {sender}."

notice-boards:
  enabled: true
  retention-days: 14
  server-author: "STEMCraft"
  title: "SERVER NOTICE / REQUEST BOARD ★★★★★"
  # Optional PNG path, relative to the STEMCraft data folder. Missing images fall back to title text.
  title-image: ""
  dialog:
    manage-title: "Your notice"
    create-title: "Post a notice"
    edit-title: "Edit your notice"
    admin-edit-title: "Edit notice by {author}"
    lifetime: "Notices remain on the board for {days} days."
    header-label: "Header"
    message-label: "Short message"
    edit-label: "Edit"
    delete-label: "Delete"
    post-label: "Post"
    save-label: "Save"
    cancel-label: "Cancel"
  messages:
    dialog-open-failed: "/error/Could not open the notice dialog."
    required: "/error/A header and message are required."
    already-active: "/error/You already have an active notice. Click the board to edit or delete it."
    posted: "/success/Your notice has been posted for {days} days."
    save-failed: "/error/Could not save your notice."
    updated: "/success/Your notice has been updated for another {days} days."
    unavailable: "/error/That notice is no longer available."
    deleted: "/success/Your notice has been deleted."
  commands:
    help: "/info/Use /noticeboard post, list, edit, expiry, remove, or board."
    unknown: "/error/Unknown noticeboard command."
    server-post-usage: "/error/Usage: /noticeboard post <header> | <message>"
    server-post-too-long: "/error/Header must be at most {header_max} characters and message at most {message_max} characters."
    server-posted: "/success/Server notice posted for {days} days."
    only-player-list: "/error/Only players can list their notices."
    no-active: "/info/You have no active notices."
    active-title: "/info/Your active notices:"
    active-entry: "{id} - {header}"
    list-title: "Notice board posts"
    list-empty: "No active notice-board posts."
    edit-usage: "/error/Usage: /noticeboard edit <post-id> [header | message]"
    edit-invalid: "/error/A header and message within the configured limits are required."
    edited: "/success/Notice {id} updated."
    expiry-usage: "/error/Usage: /noticeboard expiry <post-id> <1d|14h|-1>"
    expiry-invalid: "/error/Use a positive duration such as 1d or 14h, or -1 for no expiry."
    expiry-set: "/success/Notice {id} expiry set to {expiry}."
    expiry-never: "never"
    remove-usage: "/error/Usage: /noticeboard remove <post-id>"
    not-found: "/error/Notice not found."
    not-owner: "/error/You can only remove your own notices."
    removed: "/success/Notice removed."
    no-permission: "/error/You do not have permission to manage notice boards."
    board-usage: "/error/Usage: /noticeboard board <create|delete> <id> [columns] [rows]"
    board-removed: "/success/Notice board removed."
    target-block: "/error/Look at the bottom-left backing block for the board."
    board-created: "/success/Notice board created. The targeted block is its bottom-left backing block."

