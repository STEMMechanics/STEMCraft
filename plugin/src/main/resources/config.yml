        - "{player} discovered gravity."
        - "{player} tried flying. Nailed the landing."
      LAVA:
        - "{player} tried to hug lava. Lava said no."
      DROWNING:
        - "{player} forgot lungs are optional only in mods."
      FIRE:
        - "{player} is now lightly toasted."
      VOID:
        - "{player} fell out of the world. Classic."
      SUFFOCATION:
        - "{player} phased into a wall. The wall won."
tab:
  update_ticks: 40 # 2s
  ping:
    good_max: 80
    warn_max: 160
  header:
    - "<gradient:#f59e0b:#ef4444><bold>STEMCraft</bold></gradient>"
    - "<gray>Welcome</gray> <yellow>{player}</yellow> <dark_gray>•</dark_gray> <gray>World</gray> <aqua>{world}</aqua>"

  footer:
    - "<gray>Ping</gray> {ping-colour}{ping}ms{/ping-colour} <dark_gray>•</dark_gray> <gray>Online</gray> <green>{online}</green>/<green>{max}</green>"
    - "<gray>Tab Name</gray> <white>{player}</white>"

  name_format: "{prefix}{player}"
  # optional: enforce max length (tab list name has limits)
  max_name_len: 48
selection_preview:
