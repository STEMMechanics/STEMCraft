hub:
  world: world
  exit_commands:
    bw_*:
      command: "bw leave"
      as-player: true
    PartyGames:
      command: "pg leave"
      as-player: true
    tb_*:
      command: "tb leave"
      as-player: true

worlds:
  world:
    display-name: "World"

coordinates:
  defaults:
    # Initial state for players who have not used /coordbar or /coord yet.
    boss-bar: false
    action-bar: false

tps-bar:
  enabled: true
  default-enabled: false
  title: "<gray>TPS<yellow>:</yellow> <tps> MSPT<yellow>:</yellow> <mspt> Ping<yellow>:</yellow> <ping>ms"
  overlay: NOTCHED_20
  fill-mode: MSPT
  progress-color:
    good: GREEN
    medium: YELLOW
    low: RED
  text-color:
    good: "<gradient:#55ff55:#00aa00><text></gradient>"
    medium: "<gradient:#ffff55:#ffaa00><text></gradient>"
    low: "<gradient:#ff5555:#aa0000><text></gradient>"
  tick-interval: 20

named-regions:
  enabled: true
  worlds:
    - survival
  display:
    # Title and subtitle are independently optional. Missing or blank values are not displayed.
    title: ""
    subtitle: "<gold>{name}</gold>"
    fade-in: 500
    stay: 5000
    fade-out: 1000
  coordbar:
    enabled: true
    # Amendments include their own spacing. No separator is added by the coordbar API.
    format: " ({name})"
  map:
    enabled: true
    # Publish accumulated region changes to Pl3xMap at most once every few minutes.
    update-minutes: 5
    # Region names appear when the polygon is hovered. Set true to keep every label visible.
    permanent-labels: false
    layers:
      biomes: "Regions"
      structures: "Structures"
    biomes:
      # Each region consistently selects one translucent ARGB colour from this palette.
      # The same RGB value is used at full opacity for its border.
      palette:
        - "#4054A0FF"
        - "#405BCB8A"
        - "#40F2C14E"
        - "#40E87979"
        - "#40B983E3"
        - "#404CC9C0"
        - "#40ED8F4A"
        - "#4088B04B"
      # Used when palette is empty, preserving compatibility with older configurations.
      stroke-colour: "#FFFF9800"
      fill-colour: "#40FF9800"
      line-thickness: 2
    structures:
      # Discovered structures use type-appropriate icons instead of boundary polygons.
      icon-size: 24
    # Existing generated terrain is loaded asynchronously and processed gradually.
    backfill-existing-chunks: true
    # Historical gaps can wait; chunks visited by players are still discovered normally.
    backfill-only-when-empty: true
    backfill-period-ticks: 10
    backfill-max-in-flight: 1
  structures:
    # Small, easily triggered structures are disabled by default.
    buried-treasure:
      enabled: false
    nether-fossil:
      enabled: false
  names:
    retirement-days: 30
    pools: {}

custom-commands:
  survival:
    permission: stemcraft.command.survival
    command: survival
    run:
      - tpworld survival

custom-portals:
  enabled: true
  # Teleport as soon as a player enters a registered portal block. Set false to use the vanilla portal warm-up.
  instant-teleport: true
  portals: {}

slime-buckets:
  enabled: true

mailboxes:
  enabled: true
  hologram:
    text: ":mail_large:"
  delivery:
    # Initial delivery delay before mail is delivered to the recipient inbox.
    base-delay: 72000
    # How often the delivery queue runs, in ticks.
    process-mail-queue: 20
    # Minimum time between "mailbox full" notices to the same player, in ticks.
    mailbox-full-cooldown: 72000
  dialog:
    title: "STEMCraft Mail"
    notice: "<yellow>This message and all items in the mailbox will be sent to the player below.</yellow>"
    recipient-label: "Send to"
    message-label: "Message"
    send-label: "Send"
    cancel-label: "Cancel"
    open-failed: "/error/Could not open the mail dialog. Your items remain in the mailbox."
    cancelled: "/info/Send mail cancelled. Your items remain in the mailbox."
  messages:
    place-failed: "/error/Failed to place mailbox: {error}"
    recipient-required: "/error/Enter the name of the player you want to send this mail to."
    recipient-not-found: "/error/Could not find a player named '{recipient}'."
    self-recipient: "/error/You cannot send mail to yourself."
    too-many-items: "/error/You cannot send that many items to a player at once."
    queued: "/success/Mail sent to {recipient}"
    mailbox-full: "/survival//warn/Your mailbox is full."
    received: "/survival//info/<gold>You received mail from {sender}."

