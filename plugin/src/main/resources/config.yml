deny_spawn_eggs:
  enabled: true
drop_player_heads:
  enabled: true
no_anvil_repair_cost:
  enabled: false
rebalance_iron_golem:
  enabled: true
  min_drops: 3
  max_drops: 5
leaf_decay_random_tick:
  enabled: true
  scan_radius: 7
  # Leaf candidates processed per tick when no world override is configured.
  default_tick_speed: 8
  candidate_retention_ticks: 1200
  replant:
    enabled: true
    # Wait until the tree has been gone this long and every player has moved away.
    delay-seconds: 90
    player-clear-radius: 24
    minimum-offset: 3
    maximum-offset: 7
    # Placing a constructed block near the old trunk treats the land as repurposed.
    repurpose-radius: 8
    candidate-lifetime-seconds: 600
voting:
  enabled: true
  # Leave blank to allow every player to vote.
  permission: ""
  tower:
    materials:
      lever: LEVER
      sign: OAK_WALL_SIGN
      lamp: REDSTONE_LAMP
    schema:
      # Reserved characters: 0-9 vote lamps, G managed sign, V personalized lever.
      # Rows are top-to-bottom. Columns run front-to-back. Dot preserves a block; space forces air.
      blocks:
        L: LECTERN
        S: STONE
      place-if-not-solid: [S]
      # [column, row from bottom]; this position becomes the clicked block at [0, 0, 0].
      click-point: [1, 0]
      layout:
        - '...9'
        - '...8'
        - '...7'
        - '...6'
        - '...5'
        - '...4'
        - '...3'
        - '...2'
        - '...1'
        - '...0'
        - '..GS'
        - 'VL.S'

