logging:
  prefixes:
    log: "[STEMCraft] "
    info: "<aqua><bold>[ i ]</bold></aqua> "
    warn: "<gold><bold>[ ! ]</bold></gold> "
    error: "<red>\uE132</red> "
    success: "<dark_green><bold>[ \u2714 ]</bold></dark_green> "
    broadcast: "<dark_purple><bold>[ ! ]</bold></dark_purple> "
  contexts:
    survival:
      prefix: "[:sword: <gold><bold>SURVIVAL</bold></gold>] "
      hide-when:
        worlds:
          - "survival*"

motd:
  title: "<blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple> <yellow><bold>STEMCRAFT</bold></yellow> <blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple><blue>■</blue><light_purple>■</light_purple>"
