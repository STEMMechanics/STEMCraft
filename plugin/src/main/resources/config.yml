      - '{player} appeared. This was not in the plan.'
      - '{player} joined. Someone hide the diamonds.'
      - '{player} has entered the chat. Blame incoming.'
      - '{player} loaded in. Expectations lowered.'
      - '{player} joined. Redstone engineers on standby.'
      - '{player} arrived. The villagers are concerned.'
  quit:
    enabled: true
    list:
      - '{player} left to "touch grass". Unconfirmed.'
      - '{player} disconnected. The hamsters stopped running.'
      - '{player} left. The server feels safer now.'
