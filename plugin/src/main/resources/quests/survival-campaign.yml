      items:
        - {material: EMERALD, amount: 6}

  the-potato-crown:
    title: "The Potato Crown"
    author: "Technoblade"
    short-description: "Technoblade would like you to bring 64 potatoes."
    description: "Potatoes are serious business, and I will not entrust the harvest to someone frightened by a little dirt. Bring me a full stack, keep the fields growing, and prove that humble work can still become legendary."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    dialogue:
      offer: ["A crown starts with a field. Bring me a full stack of potatoes."]
      incomplete: ["The potato count remains tragically below legendary levels."]
      complete: ["A respectable harvest. The crown approves."]
    objectives:
      - {type: collect, target: POTATO, amount: 64, consume: true, label: "Bring 64 potatoes to Technoblade"}
    rewards:
      description: "8 Emeralds, 16 Baked Potatoes and 15 XP"
      commands: ["experience add {player} 15 points"]
      items:
        - {material: EMERALD, amount: 8}
        - {material: BAKED_POTATO, amount: 16}

  technoblade-never-dies:
    title: "Technoblade Never Dies"
    author: "Technoblade"
    short-description: "Technoblade challenges you to defeat 25 hostile mobs."
    description: "I have never believed that courage means charging forward without thinking. Prepare well, choose your ground, and defeat twenty-five hostile creatures while remembering that returning safely is part of every victory."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    dialogue:
      offer: ["Twenty-five hostile mobs. Win carefully enough to come back and tell the story."]
      incomplete: ["Preparation first, victory second, dramatic entrance third."]
      complete: ["You survived, you learned, and you made it look almost easy."]
    objectives:
      - {type: kill, target: HOSTILE, amount: 25, label: "Defeat 25 hostile mobs"}
    rewards:
      description: "1 Enchanted Golden Apple, 10 Emeralds and 30 XP"
      commands: ["experience add {player} 30 points"]
      items:
        - {material: ENCHANTED_GOLDEN_APPLE, amount: 1}
        - {material: EMERALD, amount: 10}

  not-even-close:
    title: "Not Even Close"
    author: "Technoblade"
    short-description: "Technoblade would like to see a Totem of Undying."
    description: "I want proof that you understand the value of a backup plan. Find a Totem of Undying and show it to me; I will not take it, because the clever warrior keeps an escape ready."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    dialogue:
      offer: ["Bring me a Totem of Undying. You keep the totem; I only need to know you planned ahead."]
      incomplete: ["A backup plan cannot help if it is still sitting in somebody else's mansion."]
      complete: ["Good. Keep it close and try not to need it."]
    objectives:
      - {type: collect, target: TOTEM_OF_UNDYING, amount: 1, consume: false, label: "Show a Totem of Undying to Technoblade"}
    rewards:
      description: "12 Emeralds, 32 Arrows and 20 XP"
      commands: ["experience add {player} 20 points"]
      items:
        - {material: EMERALD, amount: 12}
        - {material: ARROW, amount: 32}

  the-art-of-war:
    title: "The Art of War"
    author: "Technoblade"
    short-description: "Technoblade needs a book, feather, ink sac and crossbow."
    description: "A strong plan should survive long enough to be written down. I need a book, a feather, an ink sac, and a crossbow so this lesson can include both careful thought and practical demonstration."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    dialogue:
      offer: ["Bring writing supplies and a crossbow. Strategy benefits from examples."]
      incomplete: ["A blank page and an empty hand are equally unconvincing."]
      complete: ["Excellent. The first chapter is called: prepare before the battle."]
    objectives:
      - {type: collect, target: BOOK, amount: 1, consume: true, label: "Bring 1 book"}
      - {type: collect, target: FEATHER, amount: 1, consume: true, label: "Bring 1 feather"}
      - {type: collect, target: INK_SAC, amount: 1, consume: true, label: "Bring 1 ink sac"}
      - {type: collect, target: CROSSBOW, amount: 1, consume: true, label: "Bring 1 crossbow"}
    rewards:
      description: "1 Enchanted Book, 10 Emeralds and 25 XP"
      commands: ["experience add {player} 25 points"]
      items:
        - {material: ENCHANTED_BOOK, amount: 1}
        - {material: EMERALD, amount: 10}

  blood-for-the-blood-god:
    title: "Blood for the Blood God"
    author: "Technoblade"
    short-description: "Technoblade challenges you to defeat 12 Wither Skeletons."
    description: "The fortress paths are crowded with enemies who mistake danger for ownership. I need you to defeat twelve Wither Skeletons, keep your distance from the lava, and return with the road safer for everyone behind you."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    dialogue:
      offer: ["Twelve Wither Skeletons stand between travellers and the fortress road."]
      incomplete: ["The fortress is still not impressed. Neither am I."]
      complete: ["The road is safer, and the fortress has learned something important."]
    objectives:
      - {type: kill, target: WITHER_SKELETON, amount: 12, label: "Defeat 12 Wither Skeletons"}
    rewards:
      description: "Technoblade's Netherite Scrap, 16 Emeralds and 40 XP"
      commands: ["experience add {player} 40 points"]
      items:
        - material: NETHERITE_SCRAP
          amount: 1
          name: "Technoblade's Netherite Scrap"
          lore: ["Won on the fortress road."]
        - {material: EMERALD, amount: 16}

  the-long-road-home:
    title: "The Long Road Home"
    author: "Technoblade"
    short-description: "Technoblade asks you to endure the Nether wastes before returning."
    description: "A road is only useful when someone can travel it and find the way home. I need you to spend time in the Nether wastes, read the ground and sky, then return so I know the route did not defeat you."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    dialogue:
      offer: ["Travel through the Nether wastes, learn the route, and find me again."]
      incomplete: ["The road home becomes easier once you stop pretending every turn looks the same."]
      complete: ["You found your way back. That is the part every good expedition remembers."]
    objectives:
      - {type: biome, target: nether_wastes, amount: 10, label: "Remain in the Nether wastes for 10 seconds"}
    rewards:
      description: "1 Lodestone, 1 Compass, 12 Emeralds and 30 XP"
      commands: ["experience add {player} 30 points"]
      items:
        - {material: LODESTONE, amount: 1}
        - {material: COMPASS, amount: 1}
        - {material: EMERALD, amount: 12}

  voices-carry:
    title: "Voices Carry"
    author: "Technoblade"
    short-description: "Technoblade needs a Goat Horn and music disc."
    description: "Some victories deserve to be heard beyond the hill where they happened. I need a Goat Horn and a music disc so the camp can remember that joy, laughter, and noise also belong in a legend."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    dialogue:
      offer: ["Bring a Goat Horn and a music disc. Subtlety is optional."]
      incomplete: ["The hills remain suspiciously quiet."]
      complete: ["That should be loud enough for at least three kingdoms."]
    objectives:
      - {type: collect, target: GOAT_HORN, amount: 1, consume: true, label: "Bring 1 Goat Horn"}
      - {type: collect, target: MUSIC_DISC_CAT, amount: 1, consume: true, label: "Bring music disc Cat"}
    rewards:
      description: "The Legend's Horn, 8 Emeralds and 20 XP"
      commands: ["experience add {player} 20 points"]
      items:
        - material: GOAT_HORN
          amount: 1
          name: "The Legend's Horn"
          lore: ["Let the story carry."]
        - {material: EMERALD, amount: 8}

  for-the-orphans:
    title: "For the Orphans"
    author: "Technoblade"
    short-description: "Technoblade needs food for a community storehouse."
    description: "A victory means more when someone else is safer because of it. I need bread, carrots, potatoes, and golden carrots for a community storehouse where travellers can take what they need."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    dialogue:
      offer: ["Help me fill a storehouse. Heroes still need lunch."]
      incomplete: ["The shelves are waiting, and hungry travellers are remarkably impatient."]
      complete: ["Good. A full storehouse is a victory everyone can share."]
    objectives:
      - {type: collect, target: BREAD, amount: 16, consume: true, label: "Bring 16 bread"}
      - {type: collect, target: CARROT, amount: 16, consume: true, label: "Bring 16 carrots"}
      - {type: collect, target: POTATO, amount: 16, consume: true, label: "Bring 16 potatoes"}
      - {type: collect, target: GOLDEN_CARROT, amount: 4, consume: true, label: "Bring 4 golden carrots"}
    rewards:
      description: "16 Emeralds, 1 Cake and 20 XP"
      commands: ["experience add {player} 20 points"]
      items:
        - {material: EMERALD, amount: 16}
        - {material: CAKE, amount: 1}

  one-of-us:
    title: "One of Us"
    author: "Technoblade"
    short-description: "Return to Technoblade after completing his challenges."
    description: "I have watched you gather, fight, travel, prepare, and help people who may never know your name. Come and speak with me once more; there is something worth saying after work like that."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    requires: [the-potato-crown, technoblade-never-dies, not-even-close, the-art-of-war, blood-for-the-blood-god, the-long-road-home, voices-carry, for-the-orphans]
    dialogue:
      offer: ["You have done enough running around. Come here; this part is simple."]
      incomplete: ["I am literally standing right here."]
      complete: ["You helped people, kept going, and came back smiling. You are one of us."]
    objectives:
      - {type: npc, target: "profile:tribute-technoblade", amount: 1, label: "Speak with Technoblade"}
    rewards:
      description: "The Pig of Legend and 50 XP"
      commands: ["experience add {player} 50 points"]
      items:
        - material: PIGLIN_HEAD
          amount: 1
          name: "The Pig of Legend"
          lore: ["For courage, humour, and helping others."]

  the-legend-continues:
    title: "The Legend Continues"
    author: "Technoblade"
    short-description: "Show Technoblade a Nether Star to complete the tribute."
    description: "I do not need you to surrender the star; I need you to understand what reaching it represents. Bring me a Nether Star, keep it when we are finished, and carry the story forward in whatever you build next."
    start-npc-profile: tribute-technoblade
    end-npc-profile: tribute-technoblade
    start-npc-name: "Technoblade"
    end-npc-name: "Technoblade"
    enabled: true
    repeatable: false
    requires: [one-of-us]
    dialogue:
      offer: ["Bring me a Nether Star. You earned it, so I will not be keeping it."]
      incomplete: ["The final chapter is difficult because it is supposed to mean something."]
      complete: ["Keep the star. Legends continue whenever someone chooses courage, humour, and kindness."]
    objectives:
      - {type: collect, target: NETHER_STAR, amount: 1, consume: false, label: "Show a Nether Star to Technoblade"}
    rewards:
      description: "The Potato Crown, 32 Emeralds and 100 XP"
      commands: ["experience add {player} 100 points"]
      items:
        - material: GOLDEN_HELMET
          amount: 1
          name: "The Potato Crown"
          lore: ["Technoblade Never Dies", "Carry the story forward."]
          unbreakable: true
        - {material: EMERALD, amount: 32}
        - {material: EXPERIENCE_BOTTLE, amount: 12}
  silence-in-pieces:
    title: "Silence in Pieces"
    author: "Ember"
    short-description: "Ember would like you to find music disc 5."
    description: "A music disc assembled from fragments is a trophy of careful exploration. Complete disc 5. That is why I need you to find music disc 5. Return when you are ready, and I will help you take the next step."
    start-npc-profile: campaign-31
    end-npc-profile: campaign-31
    start-npc-name: "Ember"
    end-npc-name: "Ember"
    enabled: true
    repeatable: false
    requires: [echo-from-below]
    dialogue:
      offer: ["Find music disc 5"]
      incomplete: ["The story is not finished yet. Find music disc 5."]
      complete: ["You returned with more than proof; you returned with a story worth remembering."]
    objectives:
      - {type: collect, target: "MUSIC_DISC_5", amount: 1, label: "Find music disc 5"}
    rewards:
      description: "7 Emeralds and 14 Experience Bottles"
      items:
        - {material: EMERALD, amount: 7}
        - {material: EXPERIENCE_BOTTLE, amount: 14}
  gilded-miracle:
    title: "Gilded Miracle"
    author: "Ember"
    short-description: "Ember would like you to find an enchanted golden apple."
    description: "An enchanted golden apple cannot be crafted. Find one in the forgotten places of the world. That is why I need you to find an enchanted golden apple. Do this carefully, then find me again so we can continue what we started."
    start-npc-profile: campaign-31
    end-npc-profile: campaign-31
    start-npc-name: "Ember"
    end-npc-name: "Ember"
    enabled: true
    repeatable: false
    requires: [silence-in-pieces]
    dialogue:
      offer: ["Find an enchanted golden apple"]
      incomplete: ["The story is not finished yet. Find an enchanted golden apple."]
