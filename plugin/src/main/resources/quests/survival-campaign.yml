        - {material: EXPERIENCE_BOTTLE, amount: 8}
  blue-wings:
    title: "Blue Wings"
    author: "Ember"
    short-description: "Ember would like you to bring an axolotl bucket."
    description: "A blue axolotl is almost a legend. Bring an axolotl bucket from your travels; any colour proves the care required. That is why I need you to bring an axolotl bucket. I will be waiting here. Finish the task, return safely, and we will continue."
    start-npc-profile: campaign-31
    end-npc-profile: campaign-31
    start-npc-name: "Ember"
    end-npc-name: "Ember"
    enabled: true
    repeatable: false
