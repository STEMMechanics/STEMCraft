        - {material: EXPERIENCE_BOTTLE, amount: 22}
  totem-rumour:
    title: "Totem Rumour"
    author: "Cove"
    short-description: "Cove would like you to find a Totem of Undying."
    description: "Evokers carry a charm rarer than any outpost treasure. Find a Totem of Undying before accepting the final trial. That is why I need you to find a Totem of Undying. Do this carefully, then find me again so we can continue what we started."
    start-npc-profile: campaign-29
    end-npc-profile: campaign-29
