  emerald-recovery:
    title: "Emerald Recovery"
    author: "Cove"
    short-description: "Cove would like you to recover 16 emeralds."
    description: "The outpost's stores were taken from travellers and villages. Recover emeralds for their return. That is why I need you to recover 16 emeralds. Return when you are ready, and I will help you take the next step."
