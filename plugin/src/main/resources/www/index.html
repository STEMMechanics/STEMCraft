<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STEMCraft</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #101827;
            color: #e8eef7;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(circle at top, #1e3a5f, #101827 60%);
        }
        main {
            width: min(42rem, calc(100% - 2rem));
            box-sizing: border-box;
            padding: 2.5rem;
            border: 1px solid #385779;
            border-radius: 1rem;
            background: rgb(16 24 39 / 88%);
            box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 25%);
        }
        .eyebrow {
            margin: 0 0 .5rem;
            color: #7dd3fc;
            font-size: .8rem;
            font-weight: 700;
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        h1 { margin: 0; font-size: clamp(2.2rem, 8vw, 4rem); }
        h2 { margin: 2rem 0 .75rem; font-size: 1.2rem; }
        p { line-height: 1.6; }
        .connection {
            display: grid;
            gap: .75rem;
            margin: 1rem 0;
        }
        .connection div {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: .9rem 1rem;
            border-radius: .6rem;
            background: #17263b;
        }
        code { color: #bae6fd; font-size: 1rem; }
        a { color: #7dd3fc; }
        footer { margin-top: 2rem; font-size: .9rem; color: #a8b7ca; }
        @media (max-width: 34rem) {
            main { padding: 1.5rem; }
            .connection div { display: grid; gap: .25rem; }
        }
    </style>
</head>
<body>
<main>
    <p class="eyebrow">STEMMechanics</p>
    <h1>STEMCraft</h1>
    <p>Welcome to the STEMCraft Minecraft server.</p>

    <h2>Connect to the server</h2>
    <div class="connection">
        <div><strong>Java Edition</strong><code>play.stemcraft.com.au</code></div>
        <div><strong>Bedrock Edition</strong><code>play.stemcraft.com.au:19132</code></div>
    </div>

    <p>
        <a href="/status">View server status</a>
        · <a href="https://www.stemmechanics.com.au/stemcraft">Server information</a>
        · <a href="https://stemmech.com.au/discord">Discord</a>
    </p>
    <footer>Have fun, be kind, and bring your curiosity.</footer>
</main>
</body>
</html>
