name: STEMBot

skin:
  # Filled automatically after MineSkin conversion (or migration of an old cache).
  # If both fields are populated, STEMCraft uses them without conversion.
  # To change the skin, clear both fields below and update url/slim, then reload.
  texture:
    value: ''
    signature: ''

  # Fallback source. Generated value and signature are saved above in this file.
  url: 'http://192.168.1.40:8950/stembot.png'
  slim: false

spawn-distance: 2.5
# If the preferred spot is blocked, search around the player out to this radius.
spawn-search-radius: 8
idle-timeout-seconds: 600

chat:
  # Walking away pauses the conversation and returns chat to public.
  disengage-distance: 12
  # A smaller return distance avoids switching repeatedly near the boundary.
  reengage-distance: 6
  # Abandoned bots depart silently after this many seconds away.
  away-timeout-seconds: 60

effects:
  # Linger before disappearing in a private cloud puff. Re-summons wait for this
  # departure before appearing at the new location. 20 ticks = 1 second.
  departure-delay-ticks: 60

speech:
  enabled: true

  # Quiet reading pause after every talk line, even when speech is disabled.
  # 20 ticks = 1 second. Reply prompts remain immediate and ready for input.
  post-delay-ticks: 60

  # Bukkit sound key.
  sound: 'block.note_block.bit'
  volume: 0.22

  pitch-min: 1.25
  pitch-max: 1.55

  # Each individual beep chooses a fresh random delay in this range.
  beep-interval-ticks:
    min: 2
    max: 6

  # Text length controls the number of beeps, which controls how long talk blocks.
  characters-per-beep: 6
  min-beeps: 2
  max-beeps: 30

  # Talking also performs occasional Citizens player arm animations.
  talk-gesture-ticks:
    min: 8
    max: 18

movement:
  speed: 0.9
  # Treat a walk as complete within this many blocks of its target.
  arrival-distance: 3
  wait-distance: 10
  resume-distance: 6

# Formats and engine-generated messages. Lists select one entry randomly.
messages:
  prefix: ':stembot: &bSTEMBot: &f'
  # Private player reply echo. Supports icons, colours, {player}, {bot}, {message}.
  reply-format: ':chat_bubble: &7You → {bot}: {message}'
  chat-disengaged: ':chat_bubble: &eYou are out of range. Your chat is public now. Come closer to resume; I will power down after {seconds} seconds away.'
  chat-reengaged: ':chat_bubble: &ePrivate chat with STEMBot resumed. Your messages come only to me again.'
  waiting:
    - 'I will wait here for you! Come a little closer and we can carry on.'
    - 'No rush! Catch up with me and we will keep going.'
    - 'I got a little ahead of you. Come closer and I will continue.'
    - 'Beep boop... waiting mode! Come back over when you are ready.'

  stuck:
    # Include these details when reporting a route problem to an admin.
    - 'Beep boop... navigation malfunction! My wheels have run out of ideas. Please tell an admin, or use /report STEMBot stuck in {world} at {target} during {action}.'
    - 'Bzzzt! My pathfinding circuit needs a tune-up. Please report this to an admin: /report STEMBot stuck in {world} at {target} during {action}.'

  farewell:
    - 'See you soon! Our private chat is closed; your messages go to public chat again. Summon me with /help.'

# ---------------------------------------------------------------------------
# ACTION LANGUAGE
# ---------------------------------------------------------------------------
#
# say:<text>
#   Display text immediately. No speech sound or talking gesture.
#
# await:namespace:key seconds -> success-action, skip-action
# Optional provider-verified step; skip/later/bye and topic changes cancel it.
# talk:<text>
#   Display text, use randomized robot speech and talking gestures, then wait
#   until speech finishes, then pause for speech.post-delay-ticks to allow reading.
#
# sleep:<ticks>
#   Pause this action for the given number of server ticks.
#
# walk:<x> <y> <z>
# walk:<x> <y> <z> <speed>
#   Navigate there and block until STEMBot arrives.
#   The optional speed overrides only that walk.
#
# speed:<value>
#   Change the default speed for later walk instructions in this session.
#
# look:player
# look:<x> <y> <z>
#   Turn STEMBot toward the player or location.
#
# point:player
# point:<x> <y> <z>
#   Look at the target and perform a pointing-style arm gesture.
#
# wave
# sneak
# stand
#
# action:<name>
#   Jump to another named action.
#
# listen:<pattern> -> <action>, <pattern> -> <action>
#   Wait for private chat input. Its routes are also available while preceding
#   actions run. Dismissal phrases (bye, stop, go away) interrupt at any time.
#   Alternatives use |:
#       yes|yep|tour -> hub-tour
#   Wildcards use *:
#       *survival* -> survival-help
#       * -> confused
#   Targets "close" and "end" close the session.
#
# end
# close
#   End the current STEMBot session.

actions:
  first-hub:
    - 'wave'
    - 'talk:Hi {player}! I am STEMBot, your private guide to STEMCraft.'
    - 'talk:Only you can see me. While you are nearby and our private chat is active, your ordinary chat messages come only to me.'
    - 'talk:You can interrupt me: open chat and send an example topic without a /, or say bye or go away. Commands such as /hub still start with /.'
    - 'talk:Say bye, stop, or go away at any time to return to public chat. Use /stembot close at any time. Summon me again with /help.'
    - 'talk:We can tour Survival and the noticeboard, Creative, Minigames, and the monthly challenge and voting area.'
    - 'action:hub-menu'

  hub:
    - 'wave'
    - 'talk:Hi {player}! Back for directions or another tour? My navigation circuits are ready!'
    - 'talk:Only you can see me. While you are nearby and our private chat is active, your ordinary chat messages come only to me.'
    - 'talk:You can interrupt me: open chat and send an example topic without a /, or say bye or go away. Commands such as /hub still start with /.'
    - 'talk:Say bye, stop, or go away at any time to return to public chat. Use /stembot close at any time. Summon me again with /help.'
    - 'action:hub-menu'

  hub-menu:
    - 'say::chat_bubble: &eReply: tour, Survival, Creative, noticeboard, minigames, monthly challenge, voting, rules, or hub, or bye to finish.'
    - 'listen:bye|bye!|close|exit -> close, yes|yep|sure|*tour* -> hub-survival, *survival* -> survival-help, *creative* -> creative-help, *notice* -> hub-noticeboard, *minigame*|*games* -> hub-games, *month*|*challenge*|*vot* -> hub-voting, *rules* -> rules, *hub*|*help*|*chat* -> hub-navigation, * -> hub-confused'

  hub-confused:
    - 'talk:Beep boop! I recognise a few topics. Try one of the examples below.'
    - 'action:hub-menu'

  hub-survival:
    - 'talk:Follow me to the Survival portal and the nearby noticeboard!'
    - 'walk:-871 85 346'
    - 'point:-871 85 346'
    - 'talk:This is the Survival portal. Gather resources, build a home, explore, and look for quest NPCs with yellow question marks.'
    - 'talk:Respect other players and their builds. Once inside, use /help and ask me about getting started, quests, rules, or commands.'
    - 'talk:You can also see the noticeboard here. Read community notices to find trades, projects, and people to build with.'
    - 'talk:Click the board to create a notice with a heading and message. You can have one active board notice; click again to edit or delete it.'
    - 'talk:Keep notices friendly and leave out personal information. Trades are arranged directly with players, and old notices expire automatically.'
    - 'action:hub-creative'

  hub-creative:
    - 'talk:Next stop: Creative! Follow me to the Creative portal.'
    - 'walk:-864 85 236'
    - 'point:-864 85 236'
    - 'talk:Creative gives you a plot to build and experiment with Creative mode blocks. Try a castle, a redstone invention, or a tiny dream home!'
    - 'talk::chat_bubble: In Creative, use /help and ask how do I claim a plot. I can explain plot commands and building rules there.'
    - 'action:hub-minigames'

  hub-minigames:
    - 'talk:Follow me to the Minigames entrance.'
    - 'walk:-836 85 289'
    - 'point:-836 85 289'
    - 'talk:Try BedWars to defend your bed, Bridge to reach the opposing goal, or Boat Race to race through checkpoints.'
    - 'talk:Parkour tests your jumps, TNT Run keeps you moving over a disappearing floor, and Minefield challenges you to find a safe route.'
    - 'talk:Nightfall is about preparing by day and surviving zombie nights. SkyBlock starts you on a tiny floating island.'
    - 'talk:Check the entrance menus, signs, and portals for the games and arenas currently open. Play fairly and follow the instructions for each game.'
    - 'action:hub-challenge'

  hub-challenge:
    - 'talk:Our final stop is the monthly challenge and voting area.'
    - 'walk:-902 85 289'
    - 'point:-902 85 289'
    - 'talk:Check the information here for the current challenge, entry instructions, rules, and closing date. The challenge changes, so read it before starting!'
    - 'talk:Voting is a way to support the creations you enjoy and recognise the effort other players put into them. Look around before choosing your favourites.'
    - 'talk:When voting is open, right-click the lever for your choice. Click it again to retract that vote. You cannot vote for your own entry. Use /vote status to check voting status and your allowance.'
    - 'talk:That is our hub tour! Use /hub to return from other worlds, and /help whenever you want to summon me again.'
    - 'action:hub-menu'

  survival-help:
    - 'talk:The Survival portal is at -871 85 346, beside the noticeboard. Reply tour if you would like me to lead the full tour.'
    - 'talk:Inside Survival, use /help for advice on starting out, quests, rules, commands, and recovering items after a death.'
    - 'action:hub-menu'

  creative-help:
    - 'talk:The Creative portal is at -864 85 236. You can also enter with /creative.'
    - 'talk:Inside Creative, use /help for plot commands, building ideas, and rules. Reply tour here to follow the full hub tour.'
    - 'action:hub-menu'

  hub-noticeboard:
    - 'talk:The noticeboard is visible by the Survival portal at -871 85 346. Read it for community projects, trades, or requests.'
    - 'talk:Click the board to create a heading and message. Each player can have one active board notice; click again to edit or delete yours.'
    - 'talk:Notices expire automatically. Keep them friendly, protect personal information, and arrange advertised trades directly with the other player.'
    - 'action:hub-menu'

  hub-games:
    - 'talk:The Minigames entrance is at -836 85 289. Check its menus, signs, and portals for currently open games.'
    - 'talk:BedWars: defend beds. Bridge: reach the opposing goal. Boat Race: race through checkpoints. Parkour: jump through a course.'
    - 'talk:TNT Run: keep moving as the floor disappears. Minefield: find a safe path. Nightfall: survive zombie nights. SkyBlock: grow a floating island.'
    - 'talk:Type an available game command, such as /bedwars or /parkour, to see its choices.'
    - 'action:hub-menu'

  hub-voting:
    - 'talk:The monthly challenge and voting area is at -902 85 289. Read the current theme, entry instructions, rules, and deadline there.'
    - 'talk:Explore the entries and vote for the work you enjoy. Your vote supports fellow creators and helps the community choose its favourites.'
    - 'talk:While voting is open, right-click a voting lever to vote, or click it again to retract your vote. You cannot vote for your own entry. /vote status shows voting status and your allowance.'
    - 'action:hub-menu'

  rules:
    - 'talk:Be kind and respectful. No bullying, spam, stealing, griefing, cheats, or exploits. Respect builds and restricted areas.'
    - 'talk:Keep personal information private. Follow world and challenge rules, and use /report <message> to report a problem to staff.'
    - 'action:hub-menu'

  hub-navigation:
    - 'talk:Use /hub to return to the hub and /help to summon me. At my reply prompts, send ordinary chat text such as tour without a slash.'
    - 'talk:Your chat is private while we are talking nearby. Walking away returns it to public chat; coming closer resumes our chat. Say bye or go away at any time, or use /stembot close, to return to public chat.'
    - 'action:hub-menu'

  survival:
    - 'wave'
    - 'talk:Hi {player}! Need a hand in Survival? Let us work it out.'
    - 'talk:Only you can see me. While you are nearby and our private chat is active, your ordinary chat messages come only to me.'
    - 'talk:You can interrupt me: open chat and send an example topic without a /, or say bye or go away. Commands such as /hub still start with /.'
    - 'talk:Say bye, stop, or go away at any time to return to public chat. Use /stembot close at any time. Summon me again with /help.'
    - 'action:survival-menu'

  creative:
    - 'wave'
    - 'talk:Hi {player}! Need a hand in Creative? Let us work it out.'
    - 'talk:Only you can see me. While you are nearby and our private chat is active, your ordinary chat messages come only to me.'
    - 'talk:You can interrupt me: open chat and send an example topic without a /, or say bye or go away. Commands such as /hub still start with /.'
    - 'talk:Say bye, stop, or go away at any time to return to public chat. Use /stembot close at any time. Summon me again with /help.'
    - 'action:creative-menu'

  first-survival:
    - 'wave'
    - 'talk:Welcome to Survival, {player}! Gather wood, tools and food, and find a safe shelter. Respect other players and their builds.'
    - 'talk:Only you can see me. Nearby chat comes privately to me; say bye whenever you want to explore. Commands still start with /.'
    - 'talk:Look for quest NPCs with yellow question marks. /coordbar helps with navigation. Say practice if you want a short optional introduction to both, or ask a topic below.'
    - 'action:survival-menu'

  survival-menu:
    - 'say::chat_bubble: &eAsk about quests, practice, coordbar, skills, cooking, animals, mail, portals, graves, rules, or commands. Say bye to finish.'
    - 'listen:bye|bye!|close|exit -> close, *practice*|*tutorial* -> survival-practice, *coord* -> survival-coordinates, *skill*|*level*|*unlock*|*xp*|*badge* -> survival-skills, *cook*|*rice*|*food*|*recipe*|*item* -> survival-cooking, *animal*|*crate*|*lead* -> survival-animals, *mail*|*gift* -> survival-mail, *portal*|*deep*|*skyland*|*wasteland*|*faraway* -> survival-portals, *sleep*|*night* -> survival-sleep, *quest* -> survival-quests, *rules* -> survival-rules, *command* -> survival-commands, *died*|*death*|*grave* -> survival-graves, *hub*|*back*|*lost*|*spawn* -> survival-navigation, *start*|*build*|*food*|*shelter* -> survival-start, *chat*|*help* -> survival-chat, * -> survival-confused'

  survival-confused:
    - 'talk:Beep boop! I recognise a few topics. Try one of the examples below.'
    - 'action:survival-menu'

  survival-start:
    - 'talk:Gather wood, make tools, find food, and light a shelter before your first night. Bring spare supplies when exploring.'
    - 'talk:Choose space away from existing builds and ask before building beside someone else. Keep shared paths and entrances clear.'
    - 'talk:Quest NPCs can give your adventure direction. Ask me about quests, or try /quest to see the quests you have accepted.'
    - 'action:survival-menu'

  survival-quests:
    - 'talk:Look for an NPC with a yellow question mark and right-click them to see available quest books. Move an offered book into your inventory and close the menu to accept.'
    - 'talk:Read your book for the story and objectives. Quests can involve gathering, crafting supplies, fighting mobs, exploring, or meeting another NPC.'
    - 'talk:Use /quest to list active quests. /quest track auto follows a carried quest book; /quest track <id> chooses one, and /quest track off hides tracking.'
    - 'talk:A yellow exclamation mark marks a current NPC objective or ready turn-in. Carry your current book and required items, then right-click the right NPC to progress or finish.'
    - 'talk:Some quests have time limits or prerequisites. Read the book carefully; if you want to give one up, /quest abandon <id> abandons it and removes its carried books.'
    - 'action:survival-menu'

  survival-rules:
    - 'talk:Be kind, play fairly, and respect other players. Do not steal, grief, open or take from belongings owned by other players without permission, or damage their builds.'
    - 'talk:Do not use cheats or exploits, bypass protections, or enter restricted areas. Keep chat friendly and personal information private.'
    - 'talk:If something goes wrong, ask staff or use /report <message>. Use the noticeboard to find people for a shared project instead of changing their builds uninvited.'
    - 'action:survival-menu'

  survival-commands:
    - 'talk:/quest lists active quests. /quest track auto enables automatic quest tracking while you carry your books.'
    - 'talk:/spawn takes you to an available world spawn. /hub returns to the hub. /back returns to your previous stored location when allowed.'
    - 'talk:/coord toggles coordinates above the hotbar; /coordbar toggles the world, time, and direction display. /help summons me again.'
    - 'action:survival-menu'

  survival-graves:
    - 'talk:After a death, read chat for the death location. When possible, your dropped items are stored in a grave chest near that spot. Otherwise they drop normally.'
    - 'talk:The coordinate boss bar guides you towards an unopened grave. Use /coordbar if you need to toggle the display, and return carefully with food and equipment.'
    - 'talk:/back may return you to your previous stored location when allowed. Check the surroundings before recovering your items, and respect graves belonging to others.'
    - 'action:survival-menu'

  survival-navigation:
    - 'talk:Type /hub to return to the hub. /spawn takes you to an available world spawn, and /coord helps you keep track of where you are.'
    - 'talk:Use /help whenever you need me here again. Try phrases such as how do quests work, I died, or what commands can I use even while I am talking or walking.'
    - 'action:survival-menu'

  survival-chat:
    - 'talk:You can interrupt me by sending a topic without a slash. Try how do quests work, I need food, or what are the rules.'
    - 'talk:Only I receive your ordinary chat while you are nearby. Walking away pauses our chat; coming closer resumes it. Say bye or go away at any time or type /stembot close to return to public chat. Use /help to summon me again.'
    - 'action:survival-menu'

  first-creative:
    - 'wave'
    - 'talk:Welcome to Creative, {player}! This is a place to build, experiment, and practise with Creative mode blocks.'
    - 'talk:Only you can see me. While you are nearby and our private chat is active, your ordinary chat messages come only to me.'
    - 'talk:You can interrupt me: open chat and send an example topic without a /, or say bye or go away. Commands such as /hub still start with /.'
    - 'talk:Say bye, stop, or go away at any time to return to public chat. Use /stembot close at any time. Summon me again with /help.'
    - 'talk:Find an unclaimed plot, stand inside it, and use /plot claim. Or use /plot auto to find and claim an available plot automatically.'
    - 'talk:Use /plot home to return to your plot. Respect other plots, keep builds appropriate, and ask before altering a build that belongs to someone else.'
    - 'talk:Creative builds and items stay separate from Survival. Use /hub to return to the hub, and /help for more ideas or plot advice.'
    - 'action:creative-menu'

  creative-menu:
    - 'say::chat_bubble: &eAsk about claiming plots, merging, deleting, helpers, WorldEdit, signs, rules, building ideas, or hub. Say bye to finish.'
    - 'listen:bye|bye!|close|exit -> close, *merge*|*join plot* -> creative-merge, *delete*|*clear*|*reset plot* -> creative-delete, *trust*|*friend*|*helper*|*add player*|*remove player* -> creative-helpers, *worldedit*|*selection*|*grid*|*particle* -> creative-selection, *sign*|*colour*|*color*|*glyph* -> creative-signs, *plot*|*claim*|*command* -> creative-plots, *rules* -> creative-rules, *idea*|*build*|*start* -> creative-ideas, *month*|*challenge*|*vot* -> creative-challenge, *quest*|*survival* -> creative-survival, *hub*|*back*|*lost* -> creative-navigation, *chat*|*help* -> creative-chat, * -> creative-confused'

  creative-confused:
    - 'talk:Beep boop! I recognise a few topics. Try one of the examples below.'
    - 'action:creative-menu'

  creative-plots:
    - 'talk:Stand inside an unclaimed plot and type /plot claim, or use /plot auto to automatically find and claim an available plot.'
    - 'talk:Use /plot home to return to your plot. Available plot commands depend on permissions; check command suggestions for further options.'
    - 'talk:Keep building within your plot and ask before involving someone else in your build. Your Creative items and builds cannot be transferred to Survival.'
    - 'action:creative-menu'

  creative-rules:
    - 'talk:Build within your plot, respect the creations of other players, and ask permission before changing their work. Keep builds and signs appropriate for everyone.'
    - 'talk:Be kind in chat, keep personal information private, and avoid spam. Do not use cheats, exploits, or contraptions intended to disrupt the server.'
    - 'talk:Follow the posted rules for any challenge you enter. If you need staff help, use /report <message> to report a problem.'
    - 'action:creative-menu'

  creative-ideas:
    - 'talk:Try a cosy cottage, a treehouse, a space station, or a redstone door. Sketch the shape first, then add colour, lighting, and detail.'
    - 'talk:Practise one skill at a time: roofs, paths, gardens, or interiors. Ask another builder for friendly feedback.'
    - 'talk:For a themed project, visit the monthly challenge and voting area in the hub and read the current entry instructions.'
    - 'action:creative-menu'

  creative-challenge:
    - 'talk:Use /hub and visit -902 85 289 for the monthly challenge and voting. Read the current theme, rules, entry instructions, and deadline before building.'
    - 'talk:Visit the entries and support your favourites. When voting is open, right-click their voting levers; clicking again retracts a vote. /vote status shows status and your allowance.'
    - 'action:creative-menu'

  creative-survival:
    - 'talk:For resource gathering and NPC quests, head to Survival through its hub portal at -871 85 346. Use /hub to get there first.'
    - 'talk:In Survival, summon me with /help and reply quests for a guide to accepting, tracking, and completing quests.'
    - 'action:creative-menu'

  creative-navigation:
    - 'talk:Use /plot home to return to your plot or /hub to return to the hub. /help summons me again in Creative.'
    - 'talk:You can interrupt me by typing how do I claim a plot, give me building ideas, or what are the rules.'
    - 'action:creative-menu'

  creative-chat:
    - 'talk:You can interrupt me by sending a phrase such as how do I claim a plot without a slash. Commands such as /plot home still need their slash.'
    - 'talk:Only I receive your ordinary chat while you are nearby. Walking away pauses our chat; coming closer resumes it. Say bye or go away at any time or use /stembot close to return to public chat.'
    - 'action:creative-menu'

  creative-merge:
    - 'talk:To make more building space, first claim adjacent plots you are allowed to own. Stand in one and face the neighbour, then use /plot merge.'
    - 'talk:Read the confirmation before using /plot confirm if asked. Ownership, adjacency and plot limits still apply; merging cannot take someone else''s land.'
    - 'talk:Use /plot info to check the plot and /plot home to return. I will explain commands, but I will not merge or delete builds for you.'
    - 'action:creative-menu'

  creative-delete:
    - 'talk:/plot clear removes the build but keeps your claim. /plot delete removes the build and releases the claim. Both destroy the current build.'
    - 'talk:Check /plot info and save anything you need first. Read the prompt carefully, then use /plot confirm only if you still want that exact action.'
    - 'talk:If you are unsure, stop and ask an admin before confirming. There is no promise of an undo or backup.'
    - 'action:creative-menu'

  creative-helpers:
    - 'talk:/plot add <player> lets someone help while you are online. /plot trust <player> also lets them build while you are offline. Only grant access to people you trust.'
    - 'talk:/plot remove <player> removes their plot access. Use /plot info to check ownership and membership. Rank limits still apply.'
    - 'talk:Agree on your building plan and ask before changing another person''s work.'
    - 'action:creative-menu'

  creative-selection:
    - 'talk:/selpreview off hides our WorldEdit selection particles. /selpreview on shows them again; neither command changes your selected region.'
    - 'talk:/selpreview grid on or off controls the extra grid. The grid defaults off and hides itself when any side is over 64 blocks with the default settings.'
    - 'talk:These preferences do not hide minigame highlights or your client''s own display. Keep WorldEdit changes within plots where you have permission.'
    - 'action:creative-menu'

  creative-signs:
    - 'talk:Where your rank allows formatted signs, an ampersand followed by b makes text aqua. Use l for bold, n for underline, o for italic, or r to reset.'
    - 'talk:Double the ampersand to display it literally. For example, two ampersands followed by b displays an ampersand and b. Unsupported codes, such as ampersand-m, stay as text.'
    - 'talk:You can use registered glyphs such as :stembot:. Accept the resource pack so the icons display correctly.'
    - 'action:creative-menu'

  survival-coordinates:
    - 'talk:/coordbar toggles the world, time and direction bar. /coord toggles coordinates above your hotbar. Your choices are saved.'
    - 'talk:Want to try the bar? Say practice for a short optional step. You can always use /hub to return or /spawn when world-spawn access is allowed.'
    - 'action:survival-menu'

  survival-skills:
    - 'talk:/skills shows Mining, Herbalism, Farming, Fishing, Cooking, Engineering, Melee Combat and Ranged Combat. Each starts at level 1 and can reach 100.'
    - 'talk:Early levels are quick; later ones need more XP. With current defaults, stack refill unlocks at Engineering 10, hoe harvesting at Farming 15, and vein mining or tree felling at level 25 in their matching skill.'
    - 'talk:Automatic tool selection needs Mining and Engineering 20. The right tools and inventory supplies still matter. Live requirements can differ; /skills shows your progress.'
    - 'talk:Badges recognise building, playtime, quests and games. Community event awards are granted by staff.'
    - 'action:survival-menu'

  survival-cooking:
    - 'talk:Accept the resource pack to recognise custom items. Cooking includes flooded rice, foraged ingredients, prepared meals and buff foods. Read the item descriptions and handbook recipes.'
    - 'talk:You can cook eggs in a furnace, smoker or campfire. Rotten flesh also has uses such as fertilizer and Dog Treats; it is not just rubbish.'
    - 'talk:A Chisel rotates supported building blocks. Slime and Magma Buckets help exploration. Ask about animals, mail or portals for those items.'
    - 'action:survival-menu'

  survival-animals:
    - 'talk:Animal Crates carry supported small animals; read the crate instructions and respect ownership. The current name is Animal Crate, even if you remember animal barrels.'
    - 'talk:Stronger leads unlock at Farming 8 with the defaults. They resist distance breaks, but you can still remove a lead normally.'
    - 'talk:Use a poppy to guide an iron golem where the feature is enabled. Never take or move another player''s animals without permission.'
    - 'action:survival-menu'

  survival-mail:
    - 'talk:Mailboxes hold letters and attached items. Watch for a waiting-mail notification or marker, then check your mailbox.'
    - 'talk:Some minigame wins send a gift after a delay. Open a gift to claim its contents. Delivery timing and prizes depend on the game.'
    - 'talk:The Hub noticeboard is useful for projects and trades. Keep personal information out of messages and arrange trades politely.'
    - 'action:survival-menu'

  survival-portals:
    - 'talk:Exploration portals can lead to Wasteland, Skylands, The Deep and Faraway Lands. They use special frames and activation items; follow the handbook diagram.'
    - 'talk:The Deep uses a reinforced-deepslate frame and Echo Core. Skylands uses a charged purpur ring and Celestial Eyes. Ordinary echo shards and ender eyes are not substitutes.'
    - 'talk:New links use an 8-to-1 coordinate scale by default. The exit needs suitable nearby space. Skylands can float its portal above safe terrain, but will not create an island over the void.'
    - 'talk:Keep your return portal intact, write down its coordinates, and step off the arrival pad before travelling again. /hub is still available when allowed.'
    - 'action:survival-menu'

  survival-sleep:
    - 'talk:Sleeping helps the server skip night when the required vote is reached. Follow the on-screen sleep information rather than assuming every player must sleep.'
    - 'talk:Sleeping bags are for resting while travelling; read the item instructions. Light a safe shelter and remember that AFK does not protect you from mobs.'
    - 'action:survival-menu'

  survival-practice:
    - 'talk:Want a short practice? We can turn on your coordinate bar and try a private quest with no rewards or risk to your real quest progress.'
    - 'say::chat_bubble: &eReply yes, coordinates, quest, or skip. Practice is optional.'
    - 'listen:yes|start|both -> practice-coordinates, *coordinate*|*coordbar* -> practice-coordinates, *quest* -> practice-quest-offer, * -> survival-menu'

  practice-coordinates:
    - 'talk:Run /coordbar to turn on your bar. If it is already on, that counts too. Say skip if you would rather do this later.'
    - 'await:stemcraft:coordbar 60 -> practice-coordinates-done, practice-skipped'
    - 'action:survival-menu'

  practice-coordinates-done:
    - 'talk:Your coordinate bar is on. It shows your world, time and direction, and can include contextual guidance. You can toggle it off whenever you like.'
    - 'action:practice-quest-offer'

  practice-quest-offer:
    - 'talk:Would you like a private practice quest? A guide will give you a book, ask you to walk a few blocks, then hand it back. No items or XP are awarded.'
    - 'say::chat_bubble: &eReply yes to start the quest, or skip to keep exploring.'
    - 'listen:yes|start|practice -> practice-quest, * -> survival-menu'

  practice-quest:
    - 'talk:Right-click the Practice Guide to accept its book. Follow the book, then return and right-click to hand in. You have three minutes; say skip or bye at any time.'
    - 'await:stemcraft:quest-practice 180 -> practice-quest-done, practice-skipped'
    - 'action:survival-menu'

  practice-quest-done:
    - 'talk:You completed and handed in the practice quest! Real quests use the same book-and-NPC pattern and may also need collected items. Look for a yellow question mark when you are ready.'
    - 'action:survival-menu'

  practice-skipped:
    - 'talk:No problem. We can leave practice there. If the step was unavailable, make sure you have space and are in Survival. Ask me about practice any time.'
    - 'action:survival-menu'


# /help (alias of /stembot) routes by the current Bukkit world name.
# The existing hub uses "world".
command:
  world:
    world: hub
    hub: hub
    survival: survival
    creative: creative

# Automatically run once per player, per configured world.
# Completion is stored in the player PersistentDataContainer.
first-time:
  world:
    world: first-hub
    hub: first-hub
    survival: first-survival
    creative: first-creative
