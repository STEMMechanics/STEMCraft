agriculture:
  crops:
    rice:
      seed: "stemcraft:rice_shoots"
      soil: MUD
      water-above: true
      light-min: 9
      # A waterlogged propagule provides four visible, cross-edition-safe age states.
      stages: [MANGROVE_PROPAGULE, MANGROVE_PROPAGULE, MANGROVE_PROPAGULE, MANGROVE_PROPAGULE]
      seconds-per-stage: 180
      mature-drop: "stemcraft:rice"
      mature-min: 2
      mature-max: 4
      seed-drop: "stemcraft:rice_shoots"
      seed-min: 1
      seed-max: 2
      fortune: true

  foraging:
    rice-shoots:
      blocks: [SEAGRASS, TALL_SEAGRASS]
      biomes: [SWAMP, MANGROVE_SWAMP, WARM_OCEAN, LUKEWARM_OCEAN]
      chance: 0.08
      item: "stemcraft:rice_shoots"
      natural-only: true
      tools: [SHEARS]
