# Player-built portals. Coordinates are relative x,y,z; all four horizontal rotations work.
# Frame/interior are validated without loading chunks. AIR interiors use particles, never portal blocks.
# source-worlds accepts exact names or '*'; environments: NORMAL, NETHER, THE_END.
# Each generator must be enabled. Existing destinations must use the matching generator.
# Sneak-right-click a frame with shears to deactivate; breaking any required block resets all charges.
# Recipes and custom activation items are in the STEMCraft Survival data pack.
types:
  deep:
    enabled: true
    generator: stemcraft:deep
    source-worlds: [survival]
    source-environments: [NORMAL]
    destination:
      world: '{world}_deep'
      create: true
      coordinate-scale: 8.0
      search-radius: 32
      link-radius: 16
    activation:
      type: INTERACT
      item: stemcraft:echo_core
    deactivation:
      item: SHEARS
    cooldown-ticks: 100
    effects:
      light-level: 14
      warmup-ticks: 60
      screen-distortion: true
      particle: SCULK_SOUL
      activate-sound: minecraft:block.sculk_shrieker.shriek
      deactivate-sound: minecraft:block.beacon.deactivate
    interior-material: AIR
    frame:
      - "0,0,0:REINFORCED_DEEPSLATE"
      - "1,0,0:REINFORCED_DEEPSLATE"
      - "2,0,0:REINFORCED_DEEPSLATE"
      - "3,0,0:REINFORCED_DEEPSLATE"
      - "0,1,0:REINFORCED_DEEPSLATE"
      - "3,1,0:REINFORCED_DEEPSLATE"
      - "0,2,0:REINFORCED_DEEPSLATE"
      - "3,2,0:REINFORCED_DEEPSLATE"
      - "0,3,0:REINFORCED_DEEPSLATE"
      - "3,3,0:REINFORCED_DEEPSLATE"
      - "0,4,0:REINFORCED_DEEPSLATE"
      - "1,4,0:REINFORCED_DEEPSLATE"
      - "2,4,0:REINFORCED_DEEPSLATE"
      - "3,4,0:REINFORCED_DEEPSLATE"
    interior:
      - "1,1,0"
      - "2,1,0"
      - "1,2,0"
      - "2,2,0"
      - "1,3,0"
      - "2,3,0"
