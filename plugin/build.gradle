plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "2.3.1"
}

apply from: "$rootDir/buildSource.gradle"

repositories {
    mavenCentral()
    maven { url = uri("https://jitpack.io") }
    maven { url = uri("https://repo.opencollab.dev/main/") }
    maven { url = uri("https://repo.extendedclip.com/content/repositories/placeholderapi/") }
    maven { url = uri("https://maven.enginehub.org/repo/") }
    maven { url = uri("https://maven.citizensnpcs.co/repo/") }
    exclusiveContent {
        forRepository { maven { url = uri("https://api.modrinth.com/maven/") } }
        filter { includeGroup("maven.modrinth") }
    }
}

dependencies {
    implementation project(":api")
    //noinspection VulnerableLibrariesLocal
    compileOnly("io.papermc.paper:paper-api:${rootProject.ext.paperApiVersion}")
    compileOnly('org.geysermc.floodgate:api:2.2.4-SNAPSHOT')
    compileOnly('org.geysermc.geyser:api:2.9.0-SNAPSHOT')
    compileOnly('me.clip:placeholderapi:2.11.6')
    compileOnly('net.citizensnpcs:citizens-main:2.0.43-SNAPSHOT') {
        exclude group: 'net.byteflux', module: 'libby-bukkit'
    }
    compileOnly('com.googlecode.json-simple:json-simple:1.1.1')
    compileOnly('com.sk89q.worldedit:worldedit-bukkit:7.4.4')
    compileOnly('maven.modrinth:pl3xmap:26.2-554')

    // Lombok
    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")

    testCompileOnly("org.projectlombok:lombok:1.18.42")
    testAnnotationProcessor("org.projectlombok:lombok:1.18.42")

    // Vault (provided at runtime by the server). Exclude old Bukkit/Spigot API it pulls in.
    compileOnly("com.github.MilkBowl:VaultAPI:1.7") {
        exclude group: "org.bukkit", module: "bukkit"
        exclude group: "org.bukkit", module: "craftbukkit"
        exclude group: "org.spigotmc", module: "spigot-api"
        exclude group: "org.spigotmc", module: "spigot"
    }

    // SQLite JDBC Driver
    implementation("org.xerial:sqlite-jdbc:3.46.1.3")

    compileOnly("com.fasterxml.jackson.core:jackson-databind:2.21.1")
    compileOnly("com.google.code.findbugs:jsr305:3.0.2")

    testImplementation "org.junit.jupiter:junit-jupiter:5.11.0"
    testImplementation "org.mockito:mockito-core:5.12.0"
    //noinspection VulnerableLibrariesLocal
    testImplementation "io.papermc.paper:paper-api:${rootProject.ext.paperApiVersion}"
    testImplementation("com.sk89q.worldedit:worldedit-bukkit:7.4.4")
    //noinspection VulnerableLibrariesLocal
    testImplementation("org.mockbukkit.mockbukkit:mockbukkit-v26.1.2:4.114.0") {
        exclude group: "org.junit"
        exclude group: "org.junit.jupiter"
        exclude group: "org.junit.platform"
    }
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.0"
    testImplementation("com.google.code.findbugs:jsr305:3.0.2")
    testImplementation "org.yaml:snakeyaml:2.3"
}

tasks {
    runServer {
        minecraftVersion(rootProject.ext.paperRuntimeVersion)
    }
}

test {
    useJUnitPlatform()
}

// name the plugin jar
tasks.named("jar", Jar) {
    archiveBaseName.set("STEMCraft")

    archiveVersion.set("${project.version}${getArchiveBuildMetadata()}")

    // include API classes inside the plugin jar
    from(project(":api").sourceSets.main.output)
}

// expand version into plugin.yml
processResources {
    def props = [version: (version + getVersionCommandBuildMetadata())]
    inputs.properties props
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
}
